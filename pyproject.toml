# Tooling configuration only.
#
# Dependencies live in requirements.txt / requirements-dev.txt, NOT here. Declaring
# `[project].dependencies` makes Vercel treat this as a uv project and run
# `uv sync --locked`, which fails without a committed uv.lock. requirements.txt is the
# install manifest for every environment, so there is one source of truth.
#
#   runtime deps : requirements.txt
#   dev deps     : requirements-dev.txt
#   python       : .python-version (3.11 — minor pin; the patch level is the platform's)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
markers = [
  "integration: exercises the database or the HTTP app",
]

[tool.ruff]
line-length = 95
target-version = "py311"
# Generated migration bodies are not ours to format.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
  "E501",  # line length is enforced by the formatter, not the linter
  "B008",  # FastAPI's Depends()/File() in defaults is the documented idiom
]

[tool.ruff.lint.isort]
# Declared explicitly rather than inferred: ruff's src detection depends on the checkout
# path, so without this the same file passes in one clone and fails in another with a
# spurious I001.
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Not yet gating CI: annotations are being completed module by module.
files = ["app"]
plugins = []
